[pytest]
# Garante que pygame nao tente abrir display antes de qualquer import
env =
    SDL_VIDEODRIVER=dummy
    SDL_AUDIODRIVER=dummy
    PYGAME_HIDE_SUPPORT_PROMPT=1
    QT_QPA_PLATFORM=offscreen

# Resolve imports como 'from engine.core import ...' sem instalar o pacote
pythonpath = .

markers =
    slow: stress/soak test, excluded from the default CI gate (run with -m slow)
    real_dialog: opts out of the headless dialog guard (see tests/_headless_dialogs.py)

testpaths = tests
addopts = -v --tb=short

# Rede de seguranca de CI (PHASE 9.5B Stage 2.1) -- NAO e a correcao.
# Um teste deterministico termina sozinho; o timeout so existe para que um
# travamento novo apareca como falha em vez de pendurar o pipeline.
#
# Nao esta em addopts de proposito: rodadas locais nao devem falhar so porque
# a maquina esta lenta. Em CI, rode:
#     pytest --timeout=120
#
# Cuidado: um QFileDialog/QMessageBox modal bloqueia dentro do event loop C++
# do Qt, onde nem SIGALRM nem SIGTERM chegam -- pytest-timeout NAO consegue
# interromper esse caso. E por isso que tests/editor/conftest.py neutraliza os
# modais na origem; o timeout cobre apenas o resto.
