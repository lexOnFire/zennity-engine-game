name: Python Tests

on:
  push:
    branches: [main, zen/fix-phase1-tests]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check engine editor tests --select E9,F63,F7,F82

  tests:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt headless system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest > pytest-output.txt 2>&1
        continue-on-error: true

      - name: Show pytest output in log
        run: cat pytest-output.txt || true

      - name: Push log to branch
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          # Se a branch existir, a gente deleta localmente pra forçar nova
          git branch -D ci-log-${{ github.run_id }}-${{ matrix.python-version }} || true
          git checkout -b ci-log-${{ github.run_id }}-${{ matrix.python-version }}
          git add pytest-output.txt || true
          git commit -m "add pytest log for ${{ matrix.python-version }}" || true
          git push -f origin ci-log-${{ github.run_id }}-${{ matrix.python-version }} || true

      - name: Fail if tests failed
        run: |
          if grep -q "FAILED " pytest-output.txt; then
            exit 1
          fi

  windows-release-candidate:
    name: Windows / Python 3.12 / Export smoke
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/editor/test_project_exporter.py tests/editor/test_play_session_stability.py tests/logic tests/runtime -v
