[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zennity-engine"
version = "0.1.0"
description = "Engine 2D modular construída em cima do Pygame com arquitetura ECS inspirada em Unity"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.4.0"]

[project.optional-dependencies]
editor = ["PySide6>=6.7"]
dev   = ["pytest>=8.0", "pytest-env>=1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "editor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
env = [
    "SDL_VIDEODRIVER=dummy",
    "SDL_AUDIODRIVER=dummy",
    "PYGAME_HIDE_SUPPORT_PROMPT=1",
]
testpaths = ["tests"]
addopts = "-v --tb=short"
