[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zennity-engine"
version = "1.0.1"
description = "Engine 2D modular construida em cima do Pygame com arquitetura ECS inspirada em Unity"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lexOnFire"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "pygame-ce>=2.5.0",
    "PySide6>=6.5.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
editor = ["PySide6>=6.7"]
dev   = ["pytest>=8.0", "pytest-env>=1.1"]

[project.scripts]
zennity-editor = "editor.phase1_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "editor*"]

[tool.setuptools.package-data]
editor = ["themes/*.qss", "ui/svg/*.svg"]

[tool.black]
line-length = 100
target-version = ["py312"]
force-exclude = '''
(?x)(
    (?:^|[\\/])Assets[\\/]
  | (?:^|[\\/])demos[\\/]
  | (?:^|[\\/])editor[\\/]
  | (?:^|[\\/])engine[\\/]
  | (?:^|[\\/])scripts[\\/]
  | (?:^|[\\/])tests[\\/]
  | (?:^|[\\/])editor_legacy[\\/]
  | (?:^|[\\/])tools[\\/]
  | (?:^|[\\/])audit\.py$
  | (?:^|[\\/])check_lines\.py$
  | (?:^|[\\/])conftest\.py$
  | (?:^|[\\/])test_foldout\.py$
)
'''
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.vs
  | __pycache__
  | Assets
  | demos
  | editor
  | engine
  | scripts
  | tests
  | editor_legacy
  | tools
  | tools/ai
  | audit.py
  | check_lines.py
  | conftest.py
  | test_foldout.py
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    ".venv",
    ".vs",
    "__pycache__",
    "Assets",
    "demos",
    "scripts",
    "tests",
    "editor_legacy",
    "tools",
    "tools/ai",
    "audit.py",
    "check_lines.py",
    "conftest.py",
]

[tool.ruff.lint]
# Initial CI-safe baseline: syntax/name errors.
# Style rules can be expanded after the legacy/demos backlog is cleaned.
select = ["E9", "F63", "F7", "F82"]
