[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zennity-engine"
version = "0.1.0"
description = "Engine 2D modular construida em cima do Pygame com arquitetura ECS inspirada em Unity"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.4.0"]

[project.optional-dependencies]
editor = ["PySide6>=6.7"]
dev   = ["pytest>=8.0", "pytest-env>=1.1"]

[project.scripts]
zennity-editor = "editor.phase1_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "editor*"]
